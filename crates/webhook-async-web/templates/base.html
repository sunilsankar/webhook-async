<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}webhook-async{% endblock %}</title>
  <link rel="stylesheet" href="{{ prefix }}/static/style.css">
  <script src="{{ prefix }}/static/htmx.min.js"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <header>
    <a href="{% if prefix.is_empty() %}/{% else %}{{ prefix }}{% endif %}" class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      webhook-async
    </a>
    <nav>
      <a href="{% if prefix.is_empty() %}/{% else %}{{ prefix }}{% endif %}" class="{% if current_nav == "dashboard" %}active{% endif %}">Dashboard</a>
      <a href="{{ prefix }}/jobs" class="{% if current_nav == "jobs" %}active{% endif %}">Jobs</a>
      <a href="{{ prefix }}/hooks" class="{% if current_nav == "hooks" %}active{% endif %}">Hooks</a>
      <a href="{{ prefix }}/storage" class="{% if current_nav == "storage" %}active{% endif %}">Storage</a>
      <form action="{{ prefix }}/logout" method="post" style="display:inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-sm">Logout</button>
      </form>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div style="display:flex;justify-content:center;align-items:center;gap:1.5rem;flex-wrap:wrap;">
      <span><strong>webhook-async</strong> v1.2.0-beta</span>
      <span>Author: <strong>Sunil Sankar</strong></span>
      <a href="https://github.com/sunilsankar/webhook-async" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:0.35rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </a>
    </div>
  </footer>
</body>
</html>
