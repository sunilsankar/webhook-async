name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static Linux binaries (musl) — zero GLIBC dependencies, run on ANY Linux distribution
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: webhook-async-linux-arm64
            binary_name: webhook-async
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: webhook-async-linux-amd64
            binary_name: webhook-async
            use_cross: true

          # GNU Linux binaries (built via cross for older glibc compatibility)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: webhook-async-linux-arm64-gnu
            binary_name: webhook-async
            use_cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: webhook-async-linux-amd64-gnu
            binary_name: webhook-async
            use_cross: true

          # macOS
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: webhook-async-macos-arm64
            binary_name: webhook-async
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: webhook-async-macos-amd64
            binary_name: webhook-async
            use_cross: false

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: webhook-async-windows-amd64.exe
            binary_name: webhook-async.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.artifact_name }}"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.artifact_name }}"
            chmod +x "dist/${{ matrix.artifact_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          generate_release_notes: true
