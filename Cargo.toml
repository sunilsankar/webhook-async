[workspace]
resolver = "2"
members = [
  "crates/webhook-async-core",
  "crates/webhook-async-config",
  "crates/webhook-async-compat",
  "crates/webhook-async-hook-engine",
  "crates/webhook-async-api",
  "crates/webhook-async-queue",
  "crates/webhook-async-storage",
  "crates/webhook-async-storage-sqlite",
  "crates/webhook-async-storage-redis",
  "crates/webhook-async-worker",
  "crates/webhook-async-executor",
  "crates/webhook-async-web",
  "crates/webhook-async-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
askama = "0.16.1"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
ipnet = "2.12.2"
libc = "0.2"
minijinja = { version = "3.1.0", features = ["json", "serde"] }
multer = "3.1.0"
rcgen = "0.14"
redis = { version = "0.32.7", default-features = false, features = ["connection-manager", "script", "tokio-comp", "tokio-rustls-comp"] }
regex = "1.13.1"
rustls-pemfile = "2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio", "sqlite"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
xmltree = "0.12.0"
yaml_serde = "0.10.7"

webhook-async-core = { path = "crates/webhook-async-core" }
webhook-async-compat = { path = "crates/webhook-async-compat" }
webhook-async-config = { path = "crates/webhook-async-config" }
webhook-async-hook-engine = { path = "crates/webhook-async-hook-engine" }
webhook-async-storage = { path = "crates/webhook-async-storage" }
webhook-async-storage-sqlite = { path = "crates/webhook-async-storage-sqlite" }
webhook-async-storage-redis = { path = "crates/webhook-async-storage-redis" }
webhook-async-queue = { path = "crates/webhook-async-queue" }
webhook-async-executor = { path = "crates/webhook-async-executor" }
webhook-async-worker = { path = "crates/webhook-async-worker" }
webhook-async-api = { path = "crates/webhook-async-api" }
webhook-async-web = { path = "crates/webhook-async-web" }
